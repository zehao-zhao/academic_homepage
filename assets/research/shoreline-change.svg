<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Automatic shoreline extraction and change detection</title>
  <desc id="desc">Stylized satellite coastline with extracted shorelines at several dates</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8dbfc1"/><stop offset="1" stop-color="#315f7d"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="8" result="n"/><feBlend in="SourceGraphic" in2="n" mode="soft-light"/></filter>
  </defs>
  <rect width="900" height="600" fill="#f2e8d3"/>
  <path d="M0 0h900v600H0z" fill="url(#sea)"/>
  <path d="M900 0v600H508c-30-58-12-106-52-143-44-42-24-81-1-120 26-45 3-82-38-112-47-35-36-85-4-116 30-30 48-67 44-109z" fill="#879a68" filter="url(#grain)"/>
  <path d="M466-8c18 85-24 114-46 150-25 41-6 67 30 96 45 36 48 83 19 128-25 39-31 70 5 109 41 44 25 82 7 133" fill="none" stroke="#fff4d0" stroke-width="14" opacity=".9"/>
  <path d="M432-8c18 85-24 114-46 150-25 41-6 67 30 96 45 36 48 83 19 128-25 39-31 70 5 109 41 44 25 82 7 133" fill="none" stroke="#ed7a5a" stroke-width="7" stroke-dasharray="17 12"/>
  <path d="M498-8c18 85-24 114-46 150-25 41-6 67 30 96 45 36 48 83 19 128-25 39-31 70 5 109 41 44 25 82 7 133" fill="none" stroke="#173b52" stroke-width="7" stroke-dasharray="5 13"/>
  <g fill="#f6f3ec" opacity=".85"><circle cx="154" cy="141" r="7"/><circle cx="228" cy="401" r="9"/><circle cx="708" cy="183" r="8"/><circle cx="752" cy="468" r="6"/></g>
</svg>
